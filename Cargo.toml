[package]
name = "seca"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.93"
description = "Bounded request replay and evidence records for authorized application reviews"
license = "MIT"
publish = false

[[bin]]
name = "seca"
path = "tools/seca/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
